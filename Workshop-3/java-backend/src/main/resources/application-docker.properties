# ===============================
# DOCKER ENVIRONMENT
# ===============================
spring.config.activate.on-profile=docker

# Database Configuration (MySQL en Docker)
spring.datasource.url=jdbc:mysql://mysql:3306/eventplatform_auth?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=app_user
spring.datasource.password=AppStrongPass1!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration (debe coincidir con Python backend)
jwt.secret=your-256-bit-secret-key-change-this-in-production-make-it-very-long-and-secure
jwt.expiration=86400000

# CORS Configuration
cors.allowed-origins=http://localhost:3000,http://localhost:80
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# Server Configuration
server.port=8081
server.address=0.0.0.0

# Logging
logging.level.root=INFO
logging.level.com.eventplatform=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
logging.level.org.springframework.security=INFO

