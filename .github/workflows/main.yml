name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: eventplatform_auth
        ports:
          - 3306:3306
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 200127
          POSTGRES_DB: eventplatform
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build and test Java backend
        run: |
          cd Workshop-3/java-backend
          mvn clean test

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Initialize PostgreSQL database
        run: |
          # Esperar a que PostgreSQL esté listo
          until pg_isready -h localhost -U postgres; do
            echo "Waiting for PostgreSQL to be ready..."
            sleep 2
          done
          echo "PostgreSQL is ready!"
          # Ejecutar script de inicialización completa
          PGPASSWORD=200127 psql -h localhost -U postgres -d eventplatform -f "${GITHUB_WORKSPACE}/Workshop-3/python-backend/scripts/01-create-database-complete.sql"
        env:
          PGPASSWORD: 200127

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.7.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry dependencies
        uses: actions/cache@v3
        with:
          path: Workshop-3/python-backend/.venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install Python dependencies with Poetry
        working-directory: Workshop-3/python-backend
        run: |
          poetry install --no-interaction --no-root

      - name: Run Pylint code quality check
        working-directory: Workshop-3/python-backend
        run: |
          poetry run pylint app --fail-under=6.0 --output-format=text
        continue-on-error: false

      - name: Run Python tests with Poetry
        working-directory: Workshop-3/python-backend
        run: |
          poetry run pytest
        env:
          DATABASE_URL: postgresql://postgres:200127@localhost:5432/eventplatform

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Limpiar caché y node_modules frontend
        run: |
          cd Workshop-3/react-frontend
          npm cache clean --force
          rm -rf node_modules

      - name: Install frontend dependencies
        run: |
          cd Workshop-3/react-frontend
          npm ci

      - name: Verificar dependencias instaladas frontend
        run: |
          cd Workshop-3/react-frontend
          npm list --depth=1

      - name: Run frontend tests
        run: |
          cd Workshop-3/react-frontend
          CI=true npm test -- --passWithNoTests --watchAll=false

      - name: Build Docker images
        run: |
          docker build -t eventplatform-java-backend ./Workshop-3/java-backend
          docker build -t eventplatform-python-backend ./Workshop-3/python-backend
          docker build -t eventplatform-react-frontend ./Workshop-3/react-frontend
